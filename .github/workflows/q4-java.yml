name: Java Q4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile

      - name: Tests
        run: mvn test

      - name: Construir imagem Docker
        run: docker build . teste:v1

      - name: Rodar imagem Docker
        run: docker up teste
