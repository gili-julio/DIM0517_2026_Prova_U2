name: Java Q3

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile
  create_tag:
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Create tag
        run: git tag "build-${{ github.run_id }}"
